name: Frontend checks and Leaseweb release
on:
  push:
    branches: [main, release/leaseweb]
  pull_request:
    branches: [main, release/leaseweb]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22 --force
          yarn install --frozen-lockfile
      - name: Generate all four clients without database access
        run: |
          set -euo pipefail
          test "$(find prisma -name '*.prisma' -type f | wc -l | tr -d ' ')" = 4
          yarn merchize-offline-catalog:generate
          NEON_ADMIN_OPS_LEDGER_URL=postgresql://user:password@127.0.0.1:5432/admin_ops_ledger \
            yarn prisma generate --schema prisma/adminOpsLedger/adminOpsLedger.schema.prisma
          PAYPAL_TX_LEDGER_NEON_BRANCH=prod \
            PAYPAL_TX_LEDGER_NEON_DB_STRING=postgresql://user:password@127.0.0.1:5432/paypal_tx_ledger \
            yarn prisma generate --schema prisma/shop/paypal/paypalTXLedger.schema.prisma
          MERCHIZE_FULFILLMENT_OPS_NEON_BRANCH=prod \
            MERCHIZE_FULFILLMENT_OPS_NEON_DB_STRING=postgresql://user:password@127.0.0.1:5432/merchize_fulfillment_ops \
            yarn prisma generate --schema prisma/shop/merchizeFulfillmentOps/merchizeFulfillmentOps.schema.prisma
      - name: Verify read-only production datastore checks
        run: node --import tsx --test scripts/tests/check-production-datastores.test.mjs
      - name: Verify release settings and recovery behavior
        run: |
          node --test scripts/tests/check-release-settings.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_frontend_release.py
      - name: Lint and type check
        run: |
          yarn lint
          yarn next typegen
          yarn tsc --noEmit --incremental false --pretty false
      - name: Storefront safeguards
        run: yarn test:storefront
      - name: Authentication safeguards
        run: yarn test:auth
      - name: Checkout and payment safeguards
        run: yarn test:checkout
  container-build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_IMAGE: node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build both images and check synthetic settings offline
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$NODE_IMAGE"
          test "$(docker run --rm --pull never --network none --platform linux/amd64 --entrypoint node "$NODE_IMAGE" -p 'process.versions.node + " " + process.platform + "/" + process.arch')" = '26.13.1 linux/x64'
          settings="$RUNNER_TEMP/synthetic-public.env"
          umask 077
          cat > "$settings" <<'SETTINGS'
          NEXT_PUBLIC_SITE_URL=https://codexchristi.org
          NEXT_PUBLIC_SHOP_SITE_URL=https://codexchristi.shop
          NEXT_PUBLIC_DJANGO_API_BASE_URL=https://codexchristi.org/api/v1
          NEXT_PUBLIC_PAYPAL_PAYMENT_MODE=sandbox
          NEXT_PUBLIC_PAYPAL_SANDBOX_CLIENT_ID=synthetic-public-client
          NEXT_PUBLIC_CART_KEY=synthetic-cart
          SETTINGS
          docker buildx build --load --platform linux/amd64 --target runtime \
            --build-arg "NODE_IMAGE=$NODE_IMAGE" --build-arg "APP_REVISION=$GITHUB_SHA" \
            --secret "id=production_env,src=$settings" --tag codex-christi-next:ci .
          docker buildx build --load --platform linux/amd64 --target datastore-check \
            --build-arg "NODE_IMAGE=$NODE_IMAGE" --build-arg "APP_REVISION=$GITHUB_SHA" \
            --tag codex-christi-datastore-check:ci .
          docker run --rm --pull never --network none --read-only --env-file "$settings" \
            --env PAYPAL_PAYMENT_MODE=sandbox --env PAYPAL_SANDBOX_CLIENT_ID=synthetic-public-client \
            --entrypoint node codex-christi-next:ci scripts/check-release-settings.mjs --runtime
  release:
    needs: [verify, container-build]
    # This variable remains unset until the private rehearsal and cutover pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/leaseweb' && vars.LEASEWEB_FRONTEND_DEPLOY_ENABLED == 'true'
    concurrency:
      group: codex-christi-frontend-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_IMAGE: ${{ vars.CODEX_NODE_IMAGE }}
      PUBLIC_BUILD_ENV: ${{ vars.CODEX_NEXT_PUBLIC_BUILD_ENV }}
      VPS_USER: ${{ secrets.VPS_SSH_USERNAME }}
      VPS_HOST: ${{ secrets.VPS_IP }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate build inputs and prepare public settings
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, pathlib
          node = os.environ.get('NODE_IMAGE', '')
          qualified = 'node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1'
          if node != qualified:
              raise SystemExit('CODEX_NODE_IMAGE must match the qualified Node 26.13.1 image exactly.')
          lines = os.environ.get('PUBLIC_BUILD_ENV', '').splitlines()
          allowed = {'NEXT_PUBLIC_SITE_URL', 'NEXT_PUBLIC_SHOP_SITE_URL', 'NEXT_PUBLIC_DJANGO_API_BASE_URL',
                     'NEXT_PUBLIC_PAYPAL_PAYMENT_MODE', 'NEXT_PUBLIC_PAYPAL_LIVE_CLIENT_ID',
                     'NEXT_PUBLIC_PAYPAL_SANDBOX_CLIENT_ID', 'NEXT_PUBLIC_CART_KEY',
                     'NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_ORG_TOKEN', 'NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_SHOP_TOKEN'}
          keys = [line.partition('=')[0] for line in lines]
          if (not lines or len(keys) != len(set(keys)) or not set(keys) <= allowed
                  or any('=' not in line for line in lines)):
              raise SystemExit('CODEX_NEXT_PUBLIC_BUILD_ENV must contain unique assignments from the nine reviewed public names.')
          # Values are public, but the build file is kept private and removed afterwards.
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'next-public-build.env'
          path.write_text('\n'.join(lines) + '\n')
          path.chmod(0o600)
          PYTHON
      - name: Build release images once on the CI runner
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          docker pull --platform linux/amd64 "$NODE_IMAGE"
          test "$(docker run --rm --pull never --network none --platform linux/amd64 --entrypoint node "$NODE_IMAGE" -p 'process.versions.node + " " + process.platform + "/" + process.arch')" = '26.13.1 linux/x64'
          # BuildKit secret contents are not a cache key. Rebuild when public settings change.
          docker buildx build --load --no-cache-filter builder --platform linux/amd64 --target runtime \
            --build-arg "NODE_IMAGE=$NODE_IMAGE" --build-arg "APP_REVISION=$GITHUB_SHA" \
            --secret "id=production_env,src=$RUNNER_TEMP/next-public-build.env" \
            --tag "codex-christi-next:$GITHUB_SHA" .
          docker buildx build --load --platform linux/amd64 --target datastore-check \
            --build-arg "NODE_IMAGE=$NODE_IMAGE" --build-arg "APP_REVISION=$GITHUB_SHA" \
            --tag "codex-christi-datastore-check:$GITHUB_SHA" .
          docker save --output "$RUNNER_TEMP/frontend-release.tar" \
            "codex-christi-next:$GITHUB_SHA" "codex-christi-datastore-check:$GITHUB_SHA"
          cd "$RUNNER_TEMP"
          sha256sum frontend-release.tar > frontend-release.tar.sha256
      - name: Prepare pinned SSH host authentication
        env:
          VPS_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEYS_B64: ${{ secrets.VPS_SSH_HOST_KEYS }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64, os, pathlib, re
          if not re.fullmatch(r'[a-z_][a-z0-9_-]{0,31}', os.environ.get('VPS_USER', '')):
              raise SystemExit('Invalid deployment username.')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}', os.environ.get('VPS_HOST', '')):
              raise SystemExit('Invalid deployment host.')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codex-ssh'
          destination.mkdir(mode=0o700)
          for source, target in [('VPS_KEY_B64', 'key'), ('VPS_HOST_KEYS_B64', 'known_hosts')]:
              value = base64.b64decode(''.join(os.environ[source].split()), validate=True)
              if not value.strip():
                  raise SystemExit('Missing deployment authentication setting.')
              path = destination / target
              path.write_bytes(value)
              path.chmod(0o600)
          PYTHON
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/codex-ssh/known_hosts" >/dev/null
      - name: Transfer the checked artifact and deploy in the foreground
        id: deployment
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/codex-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/codex-ssh/known_hosts")
          remote="$VPS_USER@$VPS_HOST"
          incoming="$(ssh "${ssh_options[@]}" "$remote" 'umask 077; install -d -m 700 /home/codex-christi/codexchristi/.deploy/incoming; mktemp -d /home/codex-christi/codexchristi/.deploy/incoming/release-XXXXXXXX')"
          [[ "$incoming" =~ ^/home/codex-christi/codexchristi/\.deploy/incoming/release-[A-Za-z0-9]{8}$ ]]
          scp "${ssh_options[@]}" "$RUNNER_TEMP/frontend-release.tar" \
            "$RUNNER_TEMP/frontend-release.tar.sha256" "$remote:$incoming/"
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$incoming" "$GITHUB_SHA" <<'REMOTE' 2>&1 | tee "$RUNNER_TEMP/frontend-release-output.log"
          set -euo pipefail
          umask 077
          incoming="$1"
          revision="$2"
          [[ "$incoming" =~ ^/home/codex-christi/codexchristi/\.deploy/incoming/release-[A-Za-z0-9]{8}$ ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          cd "$incoming"
          sha256sum --check frontend-release.tar.sha256 > transfer-check.log 2>&1
          docker info > docker-check.log 2>&1 || { echo 'Unattended Docker access is not configured for the deployment account.' >&2; exit 1; }
          docker load --input frontend-release.tar > image-load.log 2>&1
          # Local image IDs can differ between Docker storage implementations.
          # Resolve the loaded, commit-tagged artifacts on the destination host.
          runtime_image="$(docker image inspect --format '{{.Id}}' "codex-christi-next:$revision")"
          check_image="$(docker image inspect --format '{{.Id}}' "codex-christi-datastore-check:$revision")"
          [[ "$runtime_image" =~ ^sha256:[0-9a-f]{64}$ && "$check_image" =~ ^sha256:[0-9a-f]{64}$ ]]
          cd /home/codex-christi/codexchristi
          exec 9>.deploy/deployment.lock
          flock -n 9 || { echo 'Another frontend deployment is running.' >&2; exit 1; }
          echo "VPS_EXPECTED_REVISION=$revision"
          echo "VPS_CHECKOUT_BEFORE=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          git fetch origin release/leaseweb > "$incoming/git-fetch.log" 2>&1
          git merge-base --is-ancestor HEAD "$revision"
          git merge --ff-only "$revision" > "$incoming/git-merge.log" 2>&1
          test "$(git rev-parse HEAD)" = "$revision"
          echo "VPS_CHECKOUT_AFTER=$(git rev-parse HEAD)"
          DEPLOYMENT_LOCK_FD=9 DEPLOY_REVISION="$revision" DEPLOY_IMAGE="$runtime_image" DATASTORE_CHECK_IMAGE="$check_image" \
            bash ./devScripts/production.sh
          REMOTE
      - name: Prepare deployment evidence
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'frontend-release-output.log'
          raw = source.read_text(errors='replace') if source.exists() else ''
          revision = os.environ['GITHUB_SHA']
          healthy = f'Release {revision} is healthy.' in raw.splitlines()
          allowed = re.compile(r'(?:VPS_(?:EXPECTED_REVISION|CHECKOUT_BEFORE|CHECKOUT_AFTER)=[0-9a-f]{40}|Release [0-9a-f]{40} is healthy\.)')
          evidence = [line for line in raw.splitlines() if allowed.fullmatch(line)]
          proof = {'revision': revision, 'deployment_step_outcome': os.environ.get('DEPLOY_OUTCOME', 'skipped'),
                   'expected_release_reported_healthy': healthy,
                   'deployment_verified': os.environ.get('DEPLOY_OUTCOME') == 'success' and healthy,
                   'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          destination = pathlib.Path('deployment-proof')
          destination.mkdir(exist_ok=True)
          (destination / 'proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          (destination / 'evidence.log').write_text('\n'.join(evidence) + '\n')
          print(json.dumps(proof, indent=2))
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: frontend-deployment-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-proof/
          if-no-files-found: error
          retention-days: 7
      - name: Remove runner authentication and build input files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/codex-ssh/key" "$RUNNER_TEMP/codex-ssh/known_hosts" "$RUNNER_TEMP/next-public-build.env"
