name: Push to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22 --force
          yarn install --frozen-lockfile
      - name: Generate the local catalog client
        run: yarn merchize-offline-catalog:generate
      - name: Lint and type check
        run: |
          yarn lint
          yarn next typegen
          yarn tsc --noEmit --incremental false --pretty false
      - name: Storefront and checkout safeguards
        run: yarn test:storefront
      - name: Authentication safeguards
        run: yarn test:auth
      - name: Checkout state and payment safeguards
        run: yarn test:checkout
  deploy:
    needs: verify
    if: github.event_name == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Clone the repo
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          umask 077
          printf '%s' "$VPS_SSH_KEY" | base64 -d > "$RUNNER_TEMP/vps_key.pem"
      - name: Prepare the known_hosts
        env:
          VPS_SSH_HOST_KEYS: ${{ secrets.VPS_SSH_HOST_KEYS }}
        run: |
          umask 077
          printf '%s' "$VPS_SSH_HOST_KEYS" | base64 -d > "$RUNNER_TEMP/vps_known_hosts"
      - name: Deploy the verified commit and wait for readiness
        env:
          VPS_SSH_USERNAME: ${{ secrets.VPS_SSH_USERNAME }}
          VPS_IP: ${{ secrets.VPS_IP }}
        run: |
          set -euo pipefail
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps_known_hosts" -o ConnectTimeout=15 \
            -i "$RUNNER_TEMP/vps_key.pem" "$VPS_SSH_USERNAME@$VPS_IP" \
            bash -s -- "$GITHUB_SHA" < devScripts/deploy-verified-release.sh
      - name: Remove deployment credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/vps_key.pem" "$RUNNER_TEMP/vps_known_hosts"
