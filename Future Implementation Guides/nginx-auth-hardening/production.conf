# Complete replacement for codex-nginx/nginx/production.conf.
# Validate inside the existing Nginx container before applying; see the auth guide.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Do not record query strings or Referer: auth URLs can contain email addresses.
  log_format json_combined escape=json
  '{'
  '"request_id":"$request_id",'
  '"host":"$host",'
  '"time":"$time_iso8601",'
  '"x_forwarded_for":"$http_x_forwarded_for",'
  '"remote_addr":"$remote_addr",'
  '"remote_user":"$remote_user",'
  '"request":"$request_method $uri $server_protocol",'
  '"status":"$status",'
  '"upstream_addr":"$upstream_addr",'
  '"body_bytes_sent":"$body_bytes_sent",'
  '"http_referrer":"",'
  '"http_user_agent":"$http_user_agent",'
  '"cache_status":"$upstream_cache_status",'
  '"request_time":"$request_time",'
  '"upstream_connect_time":"$upstream_connect_time",'
  '"upstream_header_time":"$upstream_header_time",'
  '"upstream_response_time":"$upstream_response_time",'
  '"upstream_content_encoding":"$upstream_http_content_encoding",'
  '"sent_content_encoding":"$sent_http_content_encoding",'
  '"gzip_ratio":"$gzip_ratio"'
  '}';

  access_log /var/log/nginx/access.log json_combined;
  error_log /var/log/nginx/error.log warn;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:1m;
  ssl_session_timeout 5m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
  text/plain
  text/css
  text/javascript
  application/json
  application/javascript
  application/xml
  text/xml
  application/x-font-ttf
  application/vnd.ms-fontobject
  image/svg+xml;

  proxy_cache_path /var/cache/nginx
  levels=1:2
  keys_zone=app_cache:64m
  inactive=14d
  max_size=1g
  use_temp_path=off;

  proxy_cache_path /var/cache/nginx-storefront
  levels=1:2
  keys_zone=storefront_microcache:32m
  inactive=10m
  max_size=256m
  use_temp_path=off;

  map $host $allowed_public_host {
    default 0;
    codexchristi.org 1;
    www.codexchristi.org 1;
    codexchristi.shop 1;
    www.codexchristi.shop 1;
  }

  map $http_cache_control $skip_cache {
    default 0;
    ~*no-cache 1;
    ~*no-store 1;
    ~*max-age=0 1;
  }

  map $request_method $skip_non_get {
    default 1;
    GET 0;
  }

  map $http_cookie $skip_private_cookie {
    default 0;
    "~*(^|;[[:space:]]*)(session|refreshToken|admin_session|__prerender_bypass|__next_preview_data)=" 1;
  }

  map "$http_rsc|$http_next_router_state_tree|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_x_middleware_prefetch|$http_next_url" $skip_next_rsc {
    default 1;
    "|||||" 0;
  }

  map "$http_range|$http_upgrade|$http_next_action" $skip_special_request {
    default 1;
    "||" 0;
  }

  map $http_accept $skip_component_response {
    default 0;
    ~*text/x-component 1;
  }

  map $http_authorization $skip_authorization {
    default 1;
    "" 0;
  }

  map $args $skip_query_string {
    default 1;
    "" 0;
  }

  map "$host:$uri" $skip_storefront_route {
    default 1;

    ~^(www\.)?codexchristi\.shop:/(shop/?)?$ 0;
    ~^(www\.)?codexchristi\.shop:/(shop/)?product(?:/[^/]+)?/?$ 0;
    ~^(www\.)?codexchristi\.shop:/(shop/)?categories/?$ 0;
    ~^(www\.)?codexchristi\.shop:/(shop/)?categories/all/?$ 0;
    ~^(www\.)?codexchristi\.shop:/(shop/)?category/[^/]+/?$ 0;
    ~^(www\.)?codexchristi\.shop:/(shop/)?category/[^/]+/page/[0-9]+/?$ 0;

    ~^(www\.)?codexchristi\.org:/shop/?$ 0;
    ~^(www\.)?codexchristi\.org:/shop/product(?:/[^/]+)?/?$ 0;
    ~^(www\.)?codexchristi\.org:/shop/categories/?$ 0;
    ~^(www\.)?codexchristi\.org:/shop/categories/all/?$ 0;
    ~^(www\.)?codexchristi\.org:/shop/category/[^/]+/?$ 0;
    ~^(www\.)?codexchristi\.org:/shop/category/[^/]+/page/[0-9]+/?$ 0;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # Fail closed unless Next explicitly opts fresh public HTML into the proxy cap.
  map $upstream_status $skip_response_status {
    default 1;
    200 0;
  }

  map $upstream_http_content_type $skip_response_type {
    default 1;
    "~*^text/html(;|$)" 0;
  }

  map $upstream_http_cache_control $skip_response_privacy {
    default 1;
    "~*(^|,)[[:space:]]*(private|no-store|no-cache)([[:space:]]|,|=|$)" 1;
    "~*s-maxage[^,]*,.*s-maxage" 1;
    "~*(^|,)[[:space:]]*s-maxage=[1-9][0-9]*[[:space:]]*(,|$)" 0;
  }

  map $upstream_http_x_accel_expires $skip_response_lifetime {
    default 1;
    2 0;
  }

  map $upstream_http_x_nextjs_cache $skip_response_isr {
    default 1;
    HIT 0;
    MISS 0;
    REVALIDATED 0;
  }

  # Shared HTML safeguards. Asset locations keep their explicit cache overrides.
  proxy_cache_bypass
  $skip_cache
  $skip_non_get
  $skip_private_cookie
  $skip_next_rsc
  $skip_special_request
  $skip_component_response
  $skip_authorization
  $skip_query_string
  $skip_storefront_route;

  proxy_no_cache
  $skip_cache
  $skip_non_get
  $skip_private_cookie
  $skip_next_rsc
  $skip_special_request
  $skip_component_response
  $skip_authorization
  $skip_query_string
  $skip_storefront_route
  $upstream_http_set_cookie
  $skip_response_status
  $skip_response_type
  $skip_response_privacy
  $skip_response_lifetime
  $skip_response_isr;

  proxy_http_version 1.1;
  proxy_buffer_size 16k;
  proxy_buffers 32 16k;
  proxy_busy_buffers_size 64k;
  proxy_cache storefront_microcache;
  # Do not reuse HTML entries written by the previous cache policy.
  proxy_cache_key "isr-html-v2|$scheme|$host|$request_uri|$http_accept_encoding";
  proxy_cache_valid 200 2s;
  proxy_cache_use_stale off;
  proxy_cache_lock on;
  proxy_cache_lock_timeout 10s;
  proxy_cache_background_update off;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Forwarded "";
  proxy_set_header X-Country-Code $http_cf_ipcountry;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header Connection "";

  add_header X-Request-Id $request_id always;
  add_header X-Request-Time $request_time always;
  add_header X-Cache-Status $upstream_cache_status always;

  upstream app {
    least_conn;
    server codex-con-app-start:3000 max_fails=3 fail_timeout=30s;
    keepalive 128;
  }

  upstream codex-web {
    least_conn;
    server codex-con-web max_fails=3 fail_timeout=30s;
    keepalive 128;
  }

  # Unknown TLS server names must not fall through to either application.
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
  }

  server {
    server_name codexchristi.org www.codexchristi.org;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    if ($allowed_public_host = 0) { return 444; }

    ssl_certificate /certs/cloudflare.cert.pem;
    ssl_certificate_key /certs/cloudflare.key.pem;

    location ^~ /_next/image {
      proxy_pass http://app$request_uri;
      proxy_cache app_cache;
      proxy_cache_key "$scheme$request_method$host$request_uri|$http_accept";
      proxy_cache_valid 200 301 302 30d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_bypass $skip_cache $arg_v;
      proxy_no_cache $skip_cache $arg_v;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
    }

    location ~* ^/(favicon.ico|media|sounds|_next/static)(/.*|\?.*)?$ {
      proxy_pass http://app$request_uri;
      proxy_cache app_cache;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_valid 200 301 302 365d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_bypass $skip_cache $arg_v;
      proxy_no_cache $skip_cache $arg_v;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;

      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /(opengraph-image|twitter-image) {
      proxy_pass http://app$request_uri;
      proxy_cache app_cache;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_valid 200 30s;
      proxy_cache_valid 404 1s;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_bypass $skip_cache;
      proxy_no_cache $skip_cache;

      expires 30s;
      add_header Cache-Control "public, max-age=30";
    }

    location /api {
      proxy_pass http://codex-web;
      # A local proxy_set_header list replaces the entire inherited list.
      # Keep Django's previous internal Host; no ALLOWED_HOSTS change is assumed.
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Forwarded "";
      proxy_set_header X-Country-Code $http_cf_ipcountry;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_cache off;
      proxy_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    location ^~ /next-api {
      proxy_pass http://app$request_uri;
      proxy_cache off;
    }

    location / {
      proxy_pass http://app$request_uri;
      # Privacy is checked above; do not inherit ISR's long stale window.
      proxy_ignore_headers Cache-Control Expires;
    }
  }

  server {
    server_name codexchristi.shop www.codexchristi.shop;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    if ($allowed_public_host = 0) { return 444; }

    ssl_certificate /certs/codex_shop/cloudflare.cert.pem;
    ssl_certificate_key /certs/codex_shop/cloudflare.key.pem;

    location ^~ /_next/image {
      proxy_pass http://app$request_uri;
      proxy_cache app_cache;
      proxy_cache_key "$scheme$request_method$host$request_uri|$http_accept";
      proxy_cache_valid 200 301 302 30d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_bypass $skip_cache $arg_v;
      proxy_no_cache $skip_cache $arg_v;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
    }

    location ~* ^/(favicon.ico|media|sounds|_next/static)(/.*|\?.*)?$ {
      proxy_pass http://app$request_uri;
      proxy_cache app_cache;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_valid 200 301 302 365d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_bypass $skip_cache $arg_v;
      proxy_no_cache $skip_cache $arg_v;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;

      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /(opengraph-image|twitter-image) {
      proxy_pass http://app$request_uri;
      proxy_cache app_cache;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_valid 200 30s;
      proxy_cache_valid 404 1s;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_bypass $skip_cache;
      proxy_no_cache $skip_cache;

      expires 30s;
      add_header Cache-Control "public, max-age=30";
    }

    # Public shop URLs map into Next's /shop subtree.
    location = / {
      proxy_pass http://app/shop$is_args$args;
      proxy_ignore_headers Cache-Control Expires;
    }

    location = /shop {
      return 301 /shop/;
    }

    location ^~ /shop/ {
      proxy_pass http://app$request_uri;
      proxy_ignore_headers Cache-Control Expires;
    }

    location ^~ /next-api {
      proxy_pass http://app$request_uri;
      proxy_cache off;
    }

    location / {
      proxy_pass http://app/shop$request_uri;
      proxy_ignore_headers Cache-Control Expires;
    }
  }
}
